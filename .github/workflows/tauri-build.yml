name: Build Desktop Apps

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  VITE_APP_PASSWORD: ${{ secrets.VITE_APP_PASSWORD }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (64-bit)
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: ""
            artifact-name: windows-x64

          # macOS Apple Silicon (M1/M2/M3/M4)
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            artifact-name: macos-arm64

          # macOS Intel
          - platform: macos-13
            rust-target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            artifact-name: macos-x64

          # Linux (64-bit)
          - platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            args: ""
            artifact-name: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            components
            data
            plugins
            scripts
            src-tauri
            App.tsx
            authUtils.ts
            data.ts
            eslint.config.js
            index.css
            index.html
            index.tsx
            package.json
            package-lock.json
            tsconfig.json
            types.ts
            utils.ts
            vite.config.ts
            kampong-chhnang-data.ts
            kampong-speu-data.ts
            kampot-data.ts
            kandal-data.ts
            phnompenh-data.ts
            sihanoukville-data.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Linux-only: install system dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # Upload Windows artifacts (.exe and .msi installers)
      - name: Upload Windows Artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: UltraTaxCalculator-${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # Upload macOS artifacts (.dmg installer)
      - name: Upload macOS Artifacts
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: UltraTaxCalculator-${{ matrix.artifact-name }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos/*.app.tar.gz

      # Upload Linux artifacts (.deb and .AppImage)
      - name: Upload Linux Artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: UltraTaxCalculator-${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
